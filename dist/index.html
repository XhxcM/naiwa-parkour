<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#193d30">
  <title>奶蛙跑酷</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233d7b4e'/%3E%3Crect x='13' y='15' width='38' height='36' rx='13' fill='%23ffd247'/%3E%3Crect x='18' y='23' width='10' height='12' fill='white'/%3E%3Crect x='36' y='23' width='10' height='12' fill='white'/%3E%3Crect x='21' y='26' width='5' height='7' fill='%232aa75b'/%3E%3Crect x='38' y='26' width='5' height='7' fill='%232aa75b'/%3E%3Crect x='26' y='40' width='12' height='3' fill='%2341291e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="game" class="menu-open" aria-label="森林三道跑酷游戏">
    <canvas id="scene" aria-label="游戏画面：上滑跳跃，下滑翻滚，左右滑动换道"></canvas>

    <header>
      <span class="brand">奶蛙跑酷</span>
      <div class="hud">
        <span id="score">000</span><span class="unit">m</span>
        <button id="pause" aria-label="暂停游戏" hidden>Ⅱ</button>
      </div>
    </header>

    <section id="menu" aria-label="选择人物皮肤并开始游戏">
      <div class="skin-switcher">
        <button id="skin-prev" class="skin-arrow" aria-label="上一套皮肤">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
        </button>
        <button id="skin-next" class="skin-arrow" aria-label="下一套皮肤">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
        </button>
      </div>
      <div class="skin-info" aria-live="polite">
        <strong id="skin-name">奶蛙</strong>
        <div id="skin-dots" class="skin-dots" aria-hidden="true"></div>
      </div>
      <button id="play">
        开始游戏
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 10 7-10 7Z"/></svg>
      </button>
      <p class="menu-help">上滑跳跃 · 下滑翻滚 · 左右滑动换道</p>
    </section>

    <section id="panel" aria-labelledby="title" hidden>
      <h1 id="title">跑得不错！</h1>
      <p id="description"></p>
      <div class="panel-actions">
        <button id="start">重新开始</button>
        <button id="home">返回主界面</button>
      </div>
      <p id="detail"></p>
    </section>

    <footer>
      <span class="touch-help">↑ 跳跃 · ↓ 翻滚 · ← → 换道</span>
      <span class="key-help">↑ / 空格 跳跃<span class="divider">·</span>↓ / S 翻滚<span class="divider">·</span>← → 换道</span>
    </footer>
    <div id="notice" role="status" aria-live="polite"></div>
  </main>
  <script src="engine.js"></script>
  <script src="vendor/three.min.js"></script>
  <script src="world.js"></script>
  <script src="game.js"></script>
</body>
</html>
